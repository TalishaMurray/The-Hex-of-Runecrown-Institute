<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link href="/css/styles.css" rel="stylesheet">
    <link href="/css/game.css" rel="stylesheet">
    <script src="/js/game.js" defer></script>
    <script src="https://jscolor.com/releases/2.4.5/jscolor.js"></script>
    <title>The Hex of Runecrown</title>
  </head>
  <body>
    <div class="character-status">
      <div id="character"><canvas id="characterCanvas" width="300" height="275"></canvas></div>
      <div id="timeDisplay"></div>
      <div id="moneyDisplay"></div>
      <div class="dropdown">
        <button class="dropdown-btn btn" id="stats-btn" onclick="toggleDropdown('stats-content')">Character Stats</button>
        <div class="dropdown-content hidden" id="stats-content">
          <ul>
            <li>Strength: <span id="stat-strength">5</span></li>
            <li>Agility: <span id="stat-agility">3</span></li>
            <li>Wisdom: <span id="stat-wisdom">7</span></li>
            <li>Stamina: <span id="stat-exhaustion">100</span></li>
          </ul>
        </div>
      </div>
      <div class="dropdown">
        <button class="dropdown-btn btn" id="inventory-btn" onclick="toggleDropdown('inventory-content')">Inventory</button>
        <div class="dropdown-content hidden" id="inventory-content">
          <ul>
            <li>1</li>
            <li>2</li>
            <li>3</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="game-area">
      <div id="text"></div>
      <div id="option-btns" class="btn-grid">
      </div>
    </div>
  </body>
</html>
